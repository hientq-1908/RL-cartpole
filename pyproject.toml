[project]
name = "cartpole-js"
version = "0.1.0"
description = "Gymnasium wrapper for the JavaScript CartPole environment"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/cartpole_js"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
